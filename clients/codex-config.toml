# OpenAI Codex CLI - MCP server config for the UE4.27 bridge.
#
# Codex reads ~/.codex/config.toml. Append this block to that file (create it if
# it does not exist). Codex does not read .mcp.json, which is why this exists.
#
# Paths are absolute on purpose: Codex launches the server with its own working
# directory, so a relative path like "mcp-server/dist/index.js" will not resolve.
#
# Build the server first:  npm run build

[mcp_servers.unreal-bridge]
command = "node"
args = ["D:/Unreal Projects/UE4_Bridge/mcp-server/dist/index.js"]
cwd = "D:/Unreal Projects/UE4_Bridge"

  [mcp_servers.unreal-bridge.env]
  # UE_ENGINE_ROOT and MCP_UNREAL_PROJECT_ROOT are deliberately absent. The
  # server reads them from bridge.local.json in the repository root, which is
  # gitignored and written by:
  #   .\Scripts\setup-unreal-project.ps1 -Project <path to .uproject>
  # Setting either here still works and takes priority, which is what you want
  # for pointing one client at a different project than the rest.
  #
  # Legacy HTTP tools stay hidden unless you explicitly set this to "1".
  # MCP_ENABLE_LEGACY_HTTP = "1"

# UE4.27 C++ API lookup (reflected types). Optional but recommended.
# Runs through the launcher so it uses the pinned virtual environment created by
# Scripts/setup-unreal-api-mcp.ps1. Launching "uvx unreal-api-mcp" directly
# resolves mcp 2.0.0, where fastmcp was removed, and crashes on import.
[mcp_servers.unreal-api]
command = "node"
args = ["D:/Unreal Projects/UE4_Bridge/Scripts/start-unreal-api-mcp.mjs"]

  [mcp_servers.unreal-api.env]
  UNREAL_VERSION = "4.27"
