name: CI

on:
  push:
    branches: [ "main", "mcpbridge-unified-plugin" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP server dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit tests (mock server + registry consistency)
        run: npm test

      - name: Python syntax check (all bridge files)
        run: |
          python - <<'EOF'
          import py_compile, glob, sys
          bad = []
          files = [f for f in glob.glob('Plugins/MCPBridge/Content/Python/**/*.py', recursive=True)
                   if '__pycache__' not in f]
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except Exception as exc:
                  bad.append((f, str(exc)))
          print(f"{len(files)} files checked, {len(bad)} errors")
          for f, e in bad:
              print(f, e)
          sys.exit(1 if bad else 0)
          EOF

      - name: Python unit tests (listener cancellation, job system)
        run: |
          python Plugins/MCPBridge/Content/Python/tests/test_listener_cancellation.py
          python Plugins/MCPBridge/Content/Python/tests/test_jobs.py

      - name: Forbidden UE5 token scan
        run: |
          set +e
          matches=$(grep -rn "EnhancedInputComponent\|UE::Tasks\|StateTree\|SmartObjects\|LevelEditorSubsystem\|EditorUtilitySubsystem\|MassAI\|AnimNext" \
            Plugins/MCPBridge/Content/Python Plugins/MCPBridge/Source \
            --include="*.py" --include="*.cpp" --include="*.h" | grep -v __pycache__)
          if [ -n "$matches" ]; then
            echo "UE5-only tokens found:"
            echo "$matches"
            exit 1
          fi
          echo "No UE5-only tokens."

      - name: No generated files tracked in the plugin
        run: |
          junk=$(git ls-files Plugins/MCPBridge | grep -Ei "__pycache__|\.pyc$|/Binaries/|/Intermediate/" || true)
          if [ -n "$junk" ]; then
            echo "Generated files tracked:"
            echo "$junk"
            exit 1
          fi
          echo "Plugin tree is clean."

  # Windows, because everything in this job shells out to Windows PowerShell or
  # exercises a Win64-only code path. The runtime's file-system guard compares
  # paths with a backslash separator and the installer derives a `\\.\pipe\`
  # name; both are correct for the only platform UE4.27 editor tooling runs on
  # here, and both are meaningless on Linux.
  editor-free-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build + unit tests + puerts pin + tool inventory + stdio smoke.
      # check:puerts SKIPS here and that is expected: the pinned 369 MB PuerTS
      # bundle is excluded by .gitignore, so no clean checkout has one. The pin
      # is enforced on the machine that installs, by install-mcp-bridge.ps1,
      # which runs the same script with --strict.
      - name: npm run verify
        run: npm run verify

      # The three acceptances that need no editor. Each builds its own fixture
      # in the temp directory and deletes it again.
      - name: Security refusals (bad token, path escape, shell, property)
        run: npm run test:security

      - name: Fresh-project install
        run: npm run test:fresh-install

      - name: Release package
        run: npm run test:package

# ---------------------------------------------------------------------------
# What CI CANNOT run, and why. This list is the useful half: everything above
# proves the bridge is well-formed, and nothing above proves it drives Unreal.
#
# Needs a live UE4.27 editor with the compiled plugin loaded:
#   Scripts/editor-acceptance.mjs            npm run acceptance:editor
#   Scripts/puerts-live-smoke.mjs            npm run smoke:puerts, smoke:physics
#   Scripts/graph-inspect-acceptance.mjs     npm run smoke:inspect
#   Scripts/behavior-tree-acceptance.mjs     npm run smoke:bt
#   Scripts/bp-failure-atomicity.mjs, bt-failure-atomicity.mjs,
#     wbp-failure-atomicity.mjs, bp-graph-patch-acceptance.mjs,
#     bp-remove-unlisted-acceptance.mjs, bp-truthful-report-acceptance.mjs
#   npm run smoke:editor, npm run test:integration
#
# Needs TWO editors and a scripted open/close/reopen sequence, so it cannot be
# a single CI step even on a self-hosted runner with an engine:
#   Scripts/session-isolation-acceptance.mjs --phase=both|a-closed|a-restarted|none
#   Scripts/editor-shutdown-acceptance.ps1
#
# Needs a target project that has been installed AND compiled by UBT:
#   Scripts/bridge-install-acceptance.mjs    npm run test:install -- --from <project>
#   The 21 sabotage cases are pure file comparison, but every one of them starts
#   from a known-good install, and "known-good" includes a built DLL.
#
# Needs UE4.27 and AutomationTool:
#   Scripts/package-mcp-bridge.ps1 -RunUAT   the binary release package
#   The UE4.27 C++ compile itself. See docs/MCP_BRIDGE_RELEASE_WORKFLOW.md.
#
# Partially covered above, and the uncovered half named where it is asserted:
#   Scripts/security-refusal-acceptance.mjs marks each case EXECUTED or STATIC.
#   The STATIC ones - the editor's bearer-token comparison and the writable
#   property allowlist - live in compiled C++ and are checked here only by
#   requiring the shipped source to still contain them. That catches a deletion
#   and nothing else. A live editor is the only thing that proves the running
#   boundary refuses.
